<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0B1B2B">Lead Prospecting Agent · Arquitectura de producción en AWS</text>
<text x="24" y="58" font-size="13" fill="#52606D">Serverless asíncrono: la API encola y responde 202; un worker con concurrencia limitada ejecuta el agente.</text>

