  <symbol id="g-region" viewBox="-16 -16 32 32"><g fill="none" stroke="#fff" stroke-width="2.2"><path d="M0 13s-9-8-9-15a9 9 0 0 1 18 0c0 7-9 15-9 15z"/><circle cx="0" cy="-2" r="3"/></g></symbol>
