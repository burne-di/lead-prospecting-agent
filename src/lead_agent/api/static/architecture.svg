<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Lead Prospecting Agent · Arquitectura de producción en AWS</title>
<desc id="d">Clientes llaman a API Gateway con JWT de Cognito; una Lambda API crea el run en DynamoDB y lo encola en SQS; un worker Lambda ejecuta el agente contra Amazon Bedrock y una API de búsqueda externa y guarda los leads en DynamoDB, que se sincroniza con el CRM vía EventBridge Pipes.</desc>
