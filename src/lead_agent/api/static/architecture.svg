<g font-size="12.5" fill="#33414E">
  <g transform="translate(24 772)"><circle r="10" fill="#0B1B2B"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">1</text><text x="20" y="0">El cliente envía POST /runs con un JWT de Cognito;</text><text x="20" y="17">recibe 202 + run_id y consulta GET /runs/{id}.</text></g>
  <g transform="translate(24 822)"><circle r="10" fill="#0B1B2B"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">2</text><text x="20" y="0">API Gateway aplica throttling y enruta a la Lambda API.</text></g>
  <g transform="translate(24 862)"><circle r="10" fill="#0B1B2B"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">3</text><text x="20" y="0">La Lambda API valida, crea el run (queued) en</text><text x="20" y="17">DynamoDB y lo encola en SQS.</text></g>
  <g transform="translate(560 772)"><circle r="10" fill="#0B1B2B"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">4</text><text x="20" y="0">SQS dispara el worker con MaximumConcurrency;</text><text x="20" y="17">tras 3 fallos el mensaje pasa a la DLQ.</text></g>
  <g transform="translate(560 822)"><circle r="10" fill="#ED7100"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">5</text><text x="20" y="0">El agente razona con Claude en Bedrock y elige la tool.</text></g>
  <g transform="translate(560 862)"><circle r="10" fill="#ED7100"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">6</text><text x="20" y="0">search_web consulta la API de búsqueda externa</text><text x="20" y="17">(presupuesto de búsquedas por run).</text></g>
  <g transform="translate(1096 772)"><circle r="10" fill="#ED7100"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">7</text><text x="20" y="0">save_lead pasa la guardia de grounding y escribe</text><text x="20" y="17">en DynamoDB con escritura condicional (dedup).</text></g>
  <g transform="translate(1096 822)"><circle r="10" fill="#7D8998"/><text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">8</text><text x="20" y="0">Streams + EventBridge Pipes sincronizan el CRM.</text></g>
