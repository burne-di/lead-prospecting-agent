[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lead-agent"
version = "0.1.0"
description = "Agente IA de prospección y cualificación de leads (PoC)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ruben Dario Quispe Vilca" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic[bedrock]>=0.40",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mangum>=0.17",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[dynamodb,sqs]>=5", "ruff>=0.5"]

[project.scripts]
lead-agent = "lead_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults
